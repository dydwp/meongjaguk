<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>멍자국 — 로그인</title>
<link rel="stylesheet" th:href="@{/css/tokens.css}" />
<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<header th:replace="~{fragments/layout :: header(active='login')}"></header>

<main class="focus-page">
  <div class="card focus-card card-pad" style="max-width:440px; text-align:center;">
    <div class="focus-badge">🐾</div>
    <h1 style="font-size:18px; margin:0 0 6px;">멍자국과 함께 산책해요</h1>
    <p class="small text-muted" style="margin:0 0 22px;">간편하게 소셜 계정으로<br>3초 만에 바로 시작할 수 있어요</p>
    <div class="oauth-group">
      <a th:href="@{/}" class="btn btn-kakao">💬 카카오로 시작하기</a>
      <a th:href="@{/}" class="btn btn-naver"><span class="oauth-icon">N</span> 네이버로 시작하기</a>
      <a th:href="@{/}" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.48 0 2.44 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        구글로 시작하기
      </a>
    </div>
    <p class="small text-muted mt-16" style="margin-bottom:0;">처음 로그인하시면 자동으로 회원가입돼요</p>
  </div>
</main>

</body>
</html>
