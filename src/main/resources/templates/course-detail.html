<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>멍자국 — 산책로 상세 (추천)</title>
<link rel="stylesheet" th:href="@{/css/tokens.css}" />
<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<header th:replace="~{fragments/layout :: header(active='mypage')}"></header>

<main class="page">
  <div class="map-preview" style="height:280px;">
    <svg viewBox="0 0 900 280" preserveAspectRatio="none">
      <path d="M90 220 C 200 160, 300 210, 380 150 S 520 90, 620 70 S 760 50, 830 40"
            fill="none" stroke="var(--color-primary)" stroke-width="3.5" stroke-dasharray="8 8" stroke-linecap="round"/>
      <circle cx="90" cy="220" r="6" fill="var(--color-primary)"/>
      <circle cx="830" cy="40" r="6" fill="var(--color-accent)"/>
    </svg>
    <span class="map-chip">지도 미리보기</span>
  </div>

  <div class="mt-24">
    <span class="tag">추천 코스</span>
    <h1 style="font-size:22px; margin:12px 0 10px;">한강 벚꽃길 코스</h1>
    <p class="small mb-0" style="font-weight:700;">거리 · 2.3km</p>
    <p class="small" style="font-weight:700; margin-top:2px;">예상 소요시간 · 약 35분</p>
    <p class="text-muted mt-16">한강공원을 따라 이어지는 평탄한 산책로예요. 그늘이 많고 노면이 고르기 때문에 나이가 많은 반려견이나 소형견도 편하게 걸을 수 있어요. 중간중간 벤치와 급수대가 있어 쉬어가기도 좋아요.</p>

    <div class="btn-row mt-16">
      <a th:href="@{/walk-record}" class="btn btn-primary">산책 시작</a>
      <a href="#" class="btn btn-outline">공유하기</a>
    </div>
  </div>
</main>

</body>
</html>
