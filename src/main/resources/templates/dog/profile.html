<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: page(title='멍자국 — 반려견 프로필', active='mypage', content=~{::main}, showFooter=false, showScript=true)}">
<head><title>멍자국 — 반려견 프로필</title></head>
<body>

<main class="focus-page">
  <div class="card focus-card card-pad" style="max-width:560px;">
    <h2 class="block-label" style="font-size:16px;">반려견 프로필</h2>

    <div style="display:flex; align-items:center; gap:16px; margin-bottom:22px;">
      <div class="photo-upload">사진 등록</div>
      <p class="small text-muted mb-0">선명한 정면 사진을 올려주시면<br>다른 이웃들이 더 쉽게 알아볼 수 있어요.</p>
    </div>

    <div class="field">
      <label>이름</label>
      <input type="text" value="초코" />
    </div>

    <div class="field-row">
      <div class="field">
        <label>종(품종)</label>
        <input type="text" value="포메라니안" />
      </div>
      <div class="field">
        <label>나이</label>
        <input type="text" value="3세" />
      </div>
    </div>

    <div class="field">
      <label>크기</label>
      <div class="pill-group" data-pill-group>
        <button type="button" class="pill selected" aria-pressed="true">소형견</button>
        <button type="button" class="pill" aria-pressed="false">중형견</button>
        <button type="button" class="pill" aria-pressed="false">대형견</button>
      </div>
    </div>

    <div class="field">
      <label>활동성</label>
      <div class="pill-group" data-pill-group>
        <button type="button" class="pill" aria-pressed="false">낮음</button>
        <button type="button" class="pill selected" aria-pressed="true">보통</button>
        <button type="button" class="pill" aria-pressed="false">높음</button>
      </div>
    </div>

    <a th:href="@{/mypage}" class="btn btn-focus mt-8">저장하기</a>
  </div>
</main>

</body>
</html>
