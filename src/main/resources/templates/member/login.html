<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: page(title='멍자국 — 로그인', active='login', content=~{::main}, showFooter=false, showScript=false)}">
<head><title>멍자국 — 로그인</title></head>
<body>

<main class="page login-page">
  <div class="login-card">
    <!-- 왼쪽: 소개 + 발자국 트레일 (장식) -->
    <section class="login-intro">
      <p class="login-eyebrow">DOG WALK MAP</p>
      <h1>우리 강아지<br>발자국을<br>지도에 남겨요</h1>

      <svg class="login-trail" viewBox="0 0 200 180" aria-hidden="true">
        <defs>
          <g id="login-paw">
            <ellipse cx="0" cy="5" rx="7" ry="6"/>
            <circle cx="-7" cy="-5" r="2.8"/>
            <circle cx="-2.5" cy="-9" r="2.8"/>
            <circle cx="2.5" cy="-9" r="2.8"/>
            <circle cx="7" cy="-5" r="2.8"/>
          </g>
        </defs>
        <path class="trail-line" d="M22 168 L150 44"/>
        <g class="trail-paws">
          <use href="#login-paw" transform="translate(24,160) rotate(40)"/>
          <use href="#login-paw" transform="translate(56,130) rotate(40)"/>
          <use href="#login-paw" transform="translate(88,108) rotate(40)"/>
          <use href="#login-paw" transform="translate(120,86) rotate(40)"/>
          <use href="#login-paw" transform="translate(146,58) rotate(40)"/>
        </g>
        <g transform="translate(172,26)">
          <path class="trail-pin" d="M0 -8 C-10 -8 -14 0 -14 5 C-14 14 0 24 0 24 C0 24 14 14 14 5 C14 0 10 -8 0 -8Z"/>
          <circle cx="0" cy="5" r="5" fill="#fff"/>
        </g>
      </svg>
    </section>

    <!-- 오른쪽: 소셜 로그인 -->
    <section class="login-form">
      <h2>시작하기</h2>
      <p class="small text-muted login-sub">소셜 계정으로 3초 만에 시작할 수 있어요</p>

      <!-- 로그인 실패 시에만 보이는 메시지 (주소에 ?error가 붙었을 때) -->
      <p th:if="${param.error}" class="mypage-message error" role="alert">
        로그인에 실패했어요. 잠시 후 다시 시도해 주세요.
      </p>

      <div class="oauth-group">
        <a th:href="@{/oauth2/authorization/kakao}" class="btn btn-kakao">
          <img th:src="@{/images/oauth/kakao-talk.png}" class="oauth-img" width="18" height="18" alt="" aria-hidden="true">
          카카오로 시작하기
        </a>
        <a th:href="@{/oauth2/authorization/naver}" class="btn btn-naver"><span class="oauth-icon">N</span> 네이버로 시작하기</a>
        <a th:href="@{/oauth2/authorization/google}" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.48 0 2.44 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          구글로 시작하기
        </a>
      </div>
      <p class="small text-muted login-note">처음 로그인하시면 자동으로 회원가입돼요</p>
    </section>
  </div>
</main>

</body>
</html>
