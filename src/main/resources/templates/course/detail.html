<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/default :: page(title='멍자국 — 산책로 상세 (추천)', active='mypage', content=~{::main}, showFooter=false, showScript=false)}"
>
  <head>
    <title>멍자국 — 산책로 상세 (추천)</title>
  </head>
  <body>
    <main
      id="course-detail"
      th:attr="data-api-base=@{/api/courses/}"
      aria-busy="true"
    >
      <div
        id="map"
        class="page"
        style="width: 100%; height: 400px"
        hidden
      ></div>
      <div class="page mt-24">
        <p id="course-status" role="status" aria-live="polite">
          산책로 정보를 불러오는 중이에요.
        </p>
        <section id="course-content" hidden>
          <span id="course-feature" class="tag">추천 코스</span>
          <h1
            id="course-name"
            style="font-size: 22px; margin: 12px 0 10px"
          ></h1>
          <p id="course-region" class="small text-muted" hidden></p>
          <p
            id="course-distance"
            class="small mb-0"
            style="font-weight: 700"
          ></p>
          <p
            id="course-duration"
            class="small"
            style="font-weight: 700; margin-top: 2px"
          ></p>
          <p
            id="course-description"
            class="text-muted mt-16"
            style="white-space: pre-line"
          ></p>
          <p
            id="course-map-status"
            class="small text-muted"
            role="status"
            hidden
          ></p>
          <div class="btn-row mt-16">
            <a th:href="@{/walk-record}" class="btn btn-primary">산책 시작</a>
            <a href="#" class="btn btn-outline">공유하기</a>
          </div>
        </section>
      </div>
      <script th:src="@{/js/course-detail.js}" defer></script>
    </main>
  </body>
</html>
