<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/default :: page(title='멍자국 — 산책로 상세 (추천)', active='mypage', content=~{::main}, showFooter=false, showScript=false)}"
>
  <head>
    <title>멍자국 — 산책로 상세 (추천)</title>
  </head>
  <body>
    <main>
      <div id="map" class="page" style="width: 100%; height: 400px"></div>
      <script>
        const container = document.getElementById("map");

        const map = new kakao.maps.Map(container, {
          center: new kakao.maps.LatLng(33.450701, 126.570667),
          level: 3,
        });

        if (!navigator.geolocation) {
          alert("현재 위치를 지원하지 않는 브라우저입니다.");
        } else {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const latitude = position.coords.latitude;
              const longitude = position.coords.longitude;
              const currentPosition = new kakao.maps.LatLng(
                latitude,
                longitude,
              );

              // 지도 중심을 현재 위치로 이동
              map.setCenter(currentPosition);

              // 현재 위치에 마커 표시
              new kakao.maps.Marker({
                map: map,
                position: currentPosition,
              });
            },
            (error) => {
              console.error("현재 위치 조회 실패:", error);
              alert("위치를 가져오지 못했습니다. 위치 권한을 확인해주세요.");
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0,
            },
          );
        }
      </script>
      <div class="page mt-24">
        <span class="tag">추천 코스</span>
        <h1 style="font-size: 22px; margin: 12px 0 10px">한강 벚꽃길 코스</h1>
        <p class="small mb-0" style="font-weight: 700">거리 · 2.3km</p>
        <p class="small" style="font-weight: 700; margin-top: 2px">
          예상 소요시간 · 약 35분
        </p>
        <p class="text-muted mt-16">
          한강공원을 따라 이어지는 평탄한 산책로예요. 그늘이 많고 노면이 고르기
          때문에 나이가 많은 반려견이나 소형견도 편하게 걸을 수 있어요. 중간중간
          벤치와 급수대가 있어 쉬어가기도 좋아요.
        </p>

        <div class="btn-row mt-16">
          <a th:href="@{/walk-record}" class="btn btn-primary">산책 시작</a>
          <a href="#" class="btn btn-outline">공유하기</a>
        </div>
      </div>
    </main>
  </body>
</html>
