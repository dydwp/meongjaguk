<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/default :: page(title='멍자국 — 추천 산책로', active=null, content=~{::main}, showFooter=false, showScript=false)}"
>
  <head>
    <title>멍자국 — 추천 산책로</title>
  </head>
  <body>
    <main class="page">
      <script th:src="@{/js/courses.js}" defer></script>
      <script th:src="@{/js/walk-recommend.js}" defer></script>
      <h1 class="page-title">추천 산책로</h1>
      <p class="page-sub">
        멍자국이 엄선한 산책 코스예요. 반려견 성향에 맞게 골라보세요.
      </p>
      <section aria-labelledby="walk-recommend-heading">
        <h2 id="walk-recommend-heading" class="block-label">
          내 주변 추천 산책로
        </h2>
        <p
          id="walk-recommend-status"
          class="small text-muted"
          role="status"
          aria-live="polite"
        ></p>
        <div
          id="walk-recommend-list"
          th:attr="data-detail-url=@{/course-detail}"
          aria-busy="false"
        ></div>
        <button
          id="walk-recommend-retry"
          class="btn btn-outline"
          type="button"
          hidden
        >
          다시 추천받기
        </button>
      </section>
    </main>
  </body>
</html>
