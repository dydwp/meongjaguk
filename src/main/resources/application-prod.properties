# ---------- 운영(배포) 전용 설정 ----------
# SPRING_PROFILES_ACTIVE=prod 로 실행하면 application.properties 의 개발용 값을 아래 값으로 덮어씁니다.
# (로컬 개발은 프로필 없이 실행하므로 기존 설정 그대로 유지)

# 테이블은 sql/db 테이블 생성 sql 스크립트로 관리 (JPA가 운영 DB 스키마를 변경하지 않음)
# 엔티티와 SQL 스크립트의 컬럼 타입이 일치하면 validate 로 바꿔 시작 시 검사하는 것을 권장
spring.jpa.hibernate.ddl-auto=none

# 운영 로그에 SQL 출력하지 않음
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 템플릿 / 정적 파일 캐시 사용 (정적 파일은 브라우저에 1시간 캐시)
spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600
