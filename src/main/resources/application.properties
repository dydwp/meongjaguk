spring.application.name=mungjaguk

server.port=8081

# 개발 중에는 템플릿을 바로바로 반영해서 확인할 수 있도록 캐시를 끕니다.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# ---------- 비밀 파일 불러오기 ----------
spring.config.import=optional:classpath:application-secret.properties

# ---------- DB 접속 정보 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/meongjaguk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA 설정 ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false