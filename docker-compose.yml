# 멍자국 로컬 Docker 실행 (MySQL + Spring 앱 + AI 서버)
# 사용법: .env.example 을 .env 로 복사해 값을 채운 뒤  docker compose up --build

name: meongjaguk

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: meongjaguk
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306" # 로컬 MySQL(3306)과 충돌하지 않도록 13306 사용
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      # 테이블 생성 SQL: 볼륨이 비어 있는 첫 실행 때만 실행됨
      # MySQL 은 파일 이름 순서(0, 1, 10, 11, ..., 2)로 실행하므로 번호를 두 자리로 바꿔 연결 (원본 파일은 그대로)
      - "./sql/db 테이블 생성 sql/0.DB 생성.sql:/docker-entrypoint-initdb.d/00_db.sql:ro"
      - "./sql/db 테이블 생성 sql/1.회원 테이블 생성.sql:/docker-entrypoint-initdb.d/01_users.sql:ro"
      - "./sql/db 테이블 생성 sql/2.반려견 테이블.sql:/docker-entrypoint-initdb.d/02_pets.sql:ro"
      - "./sql/db 테이블 생성 sql/3.추천 산책 코스 테이블 생성.sql:/docker-entrypoint-initdb.d/03_courses.sql:ro"
      - "./sql/db 테이블 생성 sql/4.추천 산책 좌표 코스 테이블 생성.sql:/docker-entrypoint-initdb.d/04_course_points.sql:ro"
      - "./sql/db 테이블 생성 sql/5.개인 산책 기록 테이블 생성.sql:/docker-entrypoint-initdb.d/05_walk_records.sql:ro"
      - "./sql/db 테이블 생성 sql/6.실제 산책 GPS 좌표 테이블 생성.sql:/docker-entrypoint-initdb.d/06_walk_record_points.sql:ro"
      - "./sql/db 테이블 생성 sql/7.동행 모집 테이블 생성.sql:/docker-entrypoint-initdb.d/07_walk_meetings.sql:ro"
      - "./sql/db 테이블 생성 sql/8.동행 신청 테이블 생성.sql:/docker-entrypoint-initdb.d/08_walk_applications.sql:ro"
      - "./sql/db 테이블 생성 sql/9.알림 테이블 생성.sql:/docker-entrypoint-initdb.d/09_notifications.sql:ro"
      - "./sql/db 테이블 생성 sql/10.댓글 테이블 생성.sql:/docker-entrypoint-initdb.d/10_comments.sql:ro"
      - "./sql/db 테이블 생성 sql/11.개인 산책 추천 경로 저장.sql:/docker-entrypoint-initdb.d/11_planned_points.sql:ro"
      - "./sql/db 테이블 생성 sql/12.산책 기록 - 반려견 연결.sql:/docker-entrypoint-initdb.d/12_walk_record_pets.sql:ro"
      - "./sql/db 테이블 생성 sql/13.동행 모집 - 반려견 연결.sql:/docker-entrypoint-initdb.d/13_walk_meeting_pets.sql:ro"

  app:
    build: .
    env_file: .env
    environment:
      # 컨테이너끼리는 서비스 이름(mysql)으로 접속
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/meongjaguk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      # 위 mysql 컨테이너의 root 계정 사용 (.env 의 MYSQL_ROOT_PASSWORD 하나로 관리)
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      # AI 산책로 추천: 브라우저 → Spring(/api/routes/recommend) → 서비스 이름(ai-server)으로 AI 서버 호출
      AI_SERVER_URL: http://ai-server:8000
      TZ: Asia/Seoul
    ports:
      - "8081:8081" # application.properties 의 server.port
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 업로드한 반려견 사진 보존
      - pet-images:/app/src/main/resources/static/images/pets

  ai-server:
    build: ./ai-server # 팀원이 작성한 ai-server/Dockerfile 사용
    ports:
      # 앱은 내부 주소(ai-server:8000)로 호출하므로 필수는 아님. 로컬에서 API 문서(http://localhost:8000/docs) 확인용으로 열어 둠
      - "8000:8000"
    volumes:
      # 그래프·녹지 데이터는 용량이 커서 이미지에 넣지 않음(ai-server/.dockerignore) → 읽기 전용으로 연결
      - ./ai-server/data:/app/data:ro
    healthcheck:
      # 시작할 때 그래프 파일을 읽느라 오래 걸리므로 start_period 를 넉넉히 둠
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  mysql-data:
  pet-images:
