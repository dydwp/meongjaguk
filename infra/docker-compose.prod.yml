# 멍자국 배포(운영) 서버용 Docker Compose (MySQL + Spring 앱 + AI 서버)
# 로컬 개발용은 레포 루트의 docker-compose.yml 을 사용
#
# 사용법 (서버에서 레포 루트 기준)
#   1) git lfs pull                                  # AI 그래프 데이터 받기
#   2) cp infra/.env.prod.example infra/.env.prod    # 값 채우기 (커밋 금지)
#   3) docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# 경로는 이 파일(infra/) 기준이라 레포 루트는 .. 로 표기

name: meongjaguk-prod

# 모든 컨테이너 공통: 로그 파일이 서버 디스크를 가득 채우지 않도록 크기 제한
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env.prod 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: meongjaguk
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 보안: DB 포트는 외부에 열지 않음 (app 컨테이너만 내부 네트워크로 접속)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      # 테이블 생성 SQL: 볼륨이 비어 있는 첫 실행 때만 실행 (prod 는 ddl-auto=none 이라 반드시 필요)
      - "../sql/db 테이블 생성 sql/0.DB 생성.sql:/docker-entrypoint-initdb.d/00_db.sql:ro"
      - "../sql/db 테이블 생성 sql/1.회원 테이블 생성.sql:/docker-entrypoint-initdb.d/01_users.sql:ro"
      - "../sql/db 테이블 생성 sql/2.반려견 테이블.sql:/docker-entrypoint-initdb.d/02_pets.sql:ro"
      - "../sql/db 테이블 생성 sql/3.추천 산책 코스 테이블 생성.sql:/docker-entrypoint-initdb.d/03_courses.sql:ro"
      - "../sql/db 테이블 생성 sql/4.추천 산책 좌표 코스 테이블 생성.sql:/docker-entrypoint-initdb.d/04_course_points.sql:ro"
      - "../sql/db 테이블 생성 sql/5.개인 산책 기록 테이블 생성.sql:/docker-entrypoint-initdb.d/05_walk_records.sql:ro"
      - "../sql/db 테이블 생성 sql/6.실제 산책 GPS 좌표 테이블 생성.sql:/docker-entrypoint-initdb.d/06_walk_record_points.sql:ro"
      - "../sql/db 테이블 생성 sql/7.동행 모집 테이블 생성.sql:/docker-entrypoint-initdb.d/07_walk_meetings.sql:ro"
      - "../sql/db 테이블 생성 sql/8.동행 신청 테이블 생성.sql:/docker-entrypoint-initdb.d/08_walk_applications.sql:ro"
      - "../sql/db 테이블 생성 sql/9.알림 테이블 생성.sql:/docker-entrypoint-initdb.d/09_notifications.sql:ro"
      - "../sql/db 테이블 생성 sql/10.댓글 테이블 생성.sql:/docker-entrypoint-initdb.d/10_comments.sql:ro"
      - "../sql/db 테이블 생성 sql/11.개인 산책 추천 경로 저장.sql:/docker-entrypoint-initdb.d/11_planned_points.sql:ro"
      - "../sql/db 테이블 생성 sql/12.산책 기록 - 반려견 연결.sql:/docker-entrypoint-initdb.d/12_walk_record_pets.sql:ro"
      - "../sql/db 테이블 생성 sql/13.동행 모집 - 반려견 연결.sql:/docker-entrypoint-initdb.d/13_walk_meeting_pets.sql:ro"
    logging: *default-logging

  app:
    build: ..
    image: meongjaguk-app:prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # 운영 설정(application-prod.properties) 적용: ddl-auto=none, SQL 로그 끄기, 캐시 사용
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/meongjaguk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env.prod 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      # AI 산책로 추천: 브라우저 → Spring(/api/routes/recommend) → 내부 네트워크로 AI 서버 호출
      AI_SERVER_URL: http://ai-server:8000
      TZ: Asia/Seoul
    ports:
      # 서버 접속 포트 (기본 80 → http://서버주소 로 접속, .env.prod 의 APP_PORT 로 변경 가능)
      - "${APP_PORT:-80}:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 8081 포트가 응답하는지 확인 (JRE 이미지에 curl 이 없어 bash 로 접속 시도)
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - pet-images:/app/src/main/resources/static/images/pets
    logging: *default-logging

  ai-server:
    build: ../ai-server
    image: meongjaguk-ai:prod
    restart: unless-stopped
    # 보안: AI 서버 포트는 외부에 열지 않음 (app 컨테이너만 내부 네트워크로 호출)
    volumes:
      - ../ai-server/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    logging: *default-logging

volumes:
  mysql-data:
  pet-images:
