name: App CI

# Spring 앱(src) 빌드·테스트. ai-server 변경만 있는 경우는 실행하지 않음
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - 'ai-server/**'
  push:
    # features/park: CI·Docker 작업 검증용 (dev 머지 후 제거)
    branches: [main, features/park]
    paths-ignore:
      - 'ai-server/**'
  # Actions 탭에서 수동 실행
  workflow_dispatch:

# 같은 브랜치에 연속 push 하면 이전 실행은 취소
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meongjaguk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # application-secret.properties 가 없으므로 환경변수로 주입 (CI 전용 dummy 값)
    # 테스트는 @TestPropertySource 로 H2(application-test.properties)를 우선 사용
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/meongjaguk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTID: dummy-google-client-id
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTSECRET: dummy-google-client-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE: profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENTID: dummy-kakao-client-id
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENTSECRET: dummy-kakao-client-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENTID: dummy-naver-client-id
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENTSECRET: dummy-naver-client-secret
      KAKAO_MAP_JSKEY: dummy-kakao-map-js-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify
